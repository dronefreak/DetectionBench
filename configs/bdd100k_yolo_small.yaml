# bdd100k_yolo_small.yaml (small tier)
# BDD100K-specific Hydra config for small-tier YOLO models (Ultralytics). Siblings: bdd100k_yolo.yaml (nano
# tier), bdd100k_yolo_medium.yaml (same dataset/recipe, batch_size re-probed per tier -- nano/small/medium
# have meaningfully different VRAM ceilings, see below). Use instead of config.yaml:
#   detectionbench-train --config-name bdd100k_yolo_small model.name=yolov10s
#
# Why BDD100K needs its own settings (from docs/datasets/bdd100k/README.md + the converted COCO annotations):
#   * Big and uniform: 70,000 train / 10,000 valid / 20,000 test images (the official Berkeley split -- all
#     three now carry real labels, see src/detectionbench/datasets/bdd100k.py), all 1280x720 dashcam frames,
#     ~18 boxes per image (p99 47, max 91). An epoch is ~1,090 optimizer steps at nbs=64, so far fewer epochs
#     are needed than on a small dataset, and validation (10k images) is large enough for mAP to be a stable
#     signal.
#   * Mixed object sizes: median box ~29 px on the native frame, but traffic lights are ~16 px and traffic signs ~21 px
#     (75-88% of them are under 16 px at imgsz=640). Resolution matters mostly for those two classes (28% of boxes).
#     Fraction of all boxes under 16 px: 55% at imgsz 640, 35% at 960, 21% at 1280.
#   * Strong imbalance: car 55%, traffic sign 19%, traffic light 14%; `train` has only ~180 boxes in total across
#     all 100,000 images, so its per-class AP will be near-noise no matter the recipe.
#
# Everything here is a reasoned starting point, not a tuned result.
# Mirrored on Hugging Face as `dronefreak/BDD100K`, in its raw as-provided
# format (see configs/dataset/bdd100k.yaml).
#
# Recommended starting points for a single consumer GPU (e.g. RTX 4070 Super, 12GB) -- the project's own
# retraining situation as of this split rebuild: no more shared/company GPU time, home GPU only, so the
# near-term retraining plan is nano/small tier first, medium/large deferred until more compute is available.
# batch_size is pinned to a measured value rather than AutoBatch ("-1"/"auto") so a long unattended home run
# can't have AutoBatch misjudge headroom and OOM-crash partway through; nbs=64 gradient accumulation (below)
# keeps the effective batch at 64 regardless, so learning_rate does not need to change with batch_size.
#
# Small-tier batch size, confirmed per model family @ imgsz=960, AMP on (1-epoch real training runs against
# this exact dataset/GPU, batch raised until CUDA OOM, with ~830-920MB already used by other processes):
#     model       clean ceiling (peak reserved)     first OOM batch
#     yolo11s     18 (~10.8 GB)                     20
#     yolov8s     20+ (~10.5 GB, ceiling not found)  >20 (most VRAM-efficient of the four)
#     yolov10s    14 (~10.5 GB)                      16
#     yolo26s     14 (~10.5 GB)                      16
#   Small-tier models are ~2.5-4x nano's parameter count, and the VRAM ceiling drops accordingly -- roughly
#   half of the nano-tier batch for the tightest two families. batch_size below (12) is the family-wide safe
#   floor -- two steps under the tightest family member's clean ceiling (14) -- so swapping model.name to any
#   small-tier model keeps working without re-tuning batch_size. Pin a higher value (up to 16 for
#   yolov10s/yolo26s, or 18 for yolo11s/yolov8s) only if you've confirmed the model and that nothing else is
#   using the GPU. (yolov9 has no small-tier model in this project's zoo -- "t"/nano is its only trained size.)
#   detectionbench-train --config-name bdd100k_yolo_small model.name=yolo11s
#     # Roughly 1.5-2.5x nano's cost per epoch (not independently measured on the full dataset -- the per-
#     # model-family probe above used a small held-out subset, sufficient for the VRAM ceiling but not for a
#     # precise img/s figure) -> ballpark ~7-18 h for the 50-epoch default; consider training.epochs=30-40
#     # for a first pass if that's too long, then extend if results look promising.

defaults:
  - dataset: bdd100k
  - _self_

model:
  # Small tier -- one step up from nano (see bdd100k_yolo.yaml) once nano results look promising and more
  # time is available. Override per run, e.g. model.name=yolov8s, model.name=yolo26s.
  name: "yolo11s"
  pretrained: true
  num_classes: ${dataset.num_classes}

training:
  dataset_yaml: ${dataset.dataset_yaml}
  epochs: 50 # COCO-pretrained weights converge quickly on ~70k images; cosine decay over 50 epochs
  # Fixed (not AutoBatch/"-1") -- family-wide safe floor across all 4 small-tier models probed, see header.
  # Raise per-model (up to 16 or 18) only once you've confirmed which model.name you're running.
  batch_size: 12
  learning_rate: 0.01 # SGD lr0; only used because optimizer is explicit (with "auto" Ultralytics ignores lr0)
  # Compromise: 640 loses most traffic lights/signs; 1280 (native width) costs ~1.8x more per epoch than 960.
  imgsz: 960
  # What Ultralytics' "auto" would pick here anyway (50 epochs x ~1,090 steps is far past its
  # 10k-iteration threshold); pinned for reproducibility.
  optimizer: "SGD"
  use_scheduler: true
  scheduler_type: "cosine" # cos_lr; decays to lr0 * lrf (0.01) by the last epoch
  use_amp: true
  patience: 10 # 10k validation images -> stable mAP, so a shorter patience than on small-val datasets is fine
  output_dir: "experiments/${dataset.name}/${model.name}"
  workers: 8
  use_augmentation: true # Ultralytics default pipeline, adjusted by extra_args below
  device: "cuda"
  seed: 0 # Ultralytics train(seed=...); 0 is its default and what the published runs used
  # Resume an interrupted run: true (or "last") continues from <output_dir>/<model>/weights/last.pt, or pass a
  # checkpoint path. Epochs/optimizer/hyperparameters come from the checkpoint; finished runs are refused.
  resume: null
  # Extra Ultralytics train() arguments (forwarded as-is). Defaults shown in comments.
  extra_args:
    warmup_epochs: 1.0 # default 3.0; with ~1,090 steps per epoch, 1 epoch is already ~1,090 warmup steps
    close_mosaic: 10 # default; last 10 epochs train without mosaic so the model sees natural dashcam scenes
    mosaic: 1.0 # default

evaluation:
  # Ultralytics remembers the training imgsz in the checkpoint, so val runs at 960 too.
  checkpoint: ${training.output_dir}/${model.name}/weights/best.pt
  model: ${model.name}
  num_classes: ${model.num_classes}
  dataset_yaml: ${training.dataset_yaml}
  split: ${dataset.eval_split}
  device: ${training.device}
  output_dir: ${training.output_dir}/${model.name}/evaluation
  save_predictions: true

hydra:
  run:
    dir: ${training.output_dir}/${model.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
