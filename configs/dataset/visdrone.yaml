# dataset/visdrone.yaml
# Hydra `dataset` config group entry for VisDrone2019-DET (aerial detection).
#
# Already benchmarked end-to-end across the full YOLO model spectrum via a
# separate codebase (https://github.com/dronefreak/VisDrone-dataset-python-toolkit);
# published model zoo:
#   https://huggingface.co/collections/dronefreak/visdrone-detection-model-zoo
# That YOLO zoo is not reproduced here. This entry wires VisDrone-DET into
# DetectionBench itself for further use (e.g. training the RF-DETR variant
# that zoo doesn't have yet, or running it through DetectionBench's own
# golden regression tests).
#
# Converted from the raw VisDrone2019-DET release
# (~/projects/VisDrone-dataset-python-toolkit/data/VisDrone2019-DET-{train,val,
# test-dev}/{images,annotations}) via:
#   detectionbench-prepare-coco --dataset visdrone --raw-dir <raw> --output-dir <coco_out>
#   detectionbench-convert-coco-to-yolo --input-dir <coco_out> --output-dir <yolo_out>   # writes <yolo_out>/data.yaml
# Verified 2026-08-03: train 6471 / valid 548 / test 1610 images, categories
# match the 11-class spec, both COCO and YOLO representations checked.

name: visdrone
dataset_yaml: /home/neural_debugger/Downloads/datasets/VisDrone/yolo_dataset/data.yaml
dataset_dir: /home/neural_debugger/Downloads/datasets/VisDrone/yolo_dataset_coco
num_classes: 11

eval_split: test
