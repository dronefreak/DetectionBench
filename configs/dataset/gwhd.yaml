# dataset/gwhd.yaml
# Hydra `dataset` config group entry for the Global Wheat Head Dataset.
#
# Converted from the raw GWHD 2021 competition release
# (images/ + competition_{train,val,test}.csv) via:
#   detectionbench-prepare-coco --dataset gwhd --raw-dir <raw> --output-dir <coco_out>
#   detectionbench-convert-coco-to-yolo --input-dir <coco_out> --output-dir <yolo_out>   # writes <yolo_out>/data.yaml

# !! MACHINE-LOCAL PATHS: `dataset_yaml` and `dataset_dir` below are absolute
# !! paths on the original author's machine -- edit both to point at your own
# !! copies before training/evaluating on this dataset.
# !!   dataset_yaml -> Ultralytics YOLO `data.yaml` (used by YOLO / RT-DETR).
# !!       This is the format published on Hugging Face:
# !!       https://huggingface.co/datasets/dronefreak/GWHD
# !!   dataset_dir  -> canonical COCO root (per-split `_annotations.coco.json`);
# !!       used by RF-DETR ONLY. Not a download -- generate it locally from the
# !!       YOLO copy with `detectionbench-convert-yolo-to-coco`.
name: gwhd
dataset_yaml: /home/neural_debugger/Downloads/datasets/GWHD/gwhd_2021/yolo_dataset/data.yaml
dataset_dir: /home/neural_debugger/Downloads/datasets/GWHD/gwhd_2021/yolo_dataset_coco
num_classes: 1

eval_split: test
