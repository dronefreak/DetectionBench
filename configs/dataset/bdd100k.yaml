# dataset/bdd100k.yaml
# Hydra `dataset` config group entry for BDD100K (multi-class driving-scene
# detection).
#
# Converted from the official Berkeley DeepDrive "100K Images" + "Labels"
# release, pulled directly from Berkeley's own distribution server (not a
# third-party mirror). Raw layout: `images_100k/100k/{train,val,test}/` +
# native per-image `labels/100k/{train,val,test}/<name>.json`, via:
#   hf download dronefreak/BDD100K --repo-type dataset --local-dir <dir>
#   detectionbench-prepare-coco --dataset bdd100k --raw-dir <dir>/data --output-dir <coco_out>
#   detectionbench-convert-coco-to-yolo --input-dir <coco_out> --output-dir <yolo_out>   # writes <yolo_out>/data.yaml
# All three official splits ship with real labels in this release --
# including `test` (20,000 images), verified directly against sample files,
# contrary to the commonly repeated claim that BDD100K withholds test
# labels for a leaderboard. The adapter maps them directly onto this
# project's canonical layout: official train -> train, official val ->
# valid, official test -> test (no more carving a validation slice out of
# train, unlike the old Kaggle-mirror-derived version of this adapter).
# Only `box2d` detection labels are converted; lane/drivable-area `poly2d`
# annotations in the same release are dropped (different task; see the
# companion `dronefreak/BDD100K-Drivable-Area-Segmentation` and
# `dronefreak/BDD100K-Semantic-Segmentation` dataset mirrors for those).
#
# License: BDD100K's data/labels carry UC Regents' own academic license
# (verified at https://github.com/bdd100k/bdd100k/blob/master/doc/source/license.rst),
# which explicitly permits redistribution for educational/research/
# not-for-profit purposes with notice (commercial use/distribution is
# restricted to BDD/BAIR Commons members). Mirrored on Hugging Face as
# `dronefreak/BDD100K` under this license, in this exact raw layout.
#
# Stats: see ../../docs/datasets/bdd100k/README.md (class distribution,
# split summary, box geometry) -- generated against the OLD Kaggle-derived
# 69,863/10,000 train/val layout; needs regenerating via
# `detectionbench-dataset-stats` against the new 70,000/10,000/20,000
# train/val/test layout.
#
# !! MACHINE-LOCAL PATHS: `dataset_yaml` and `dataset_dir` below are absolute
# !! paths on the original author's machine -- edit both to point at your own
# !! converted copy before training/evaluating on this dataset.
# !!   dataset_yaml -> Ultralytics YOLO `data.yaml` (used by YOLO / RT-DETR).
# !!   dataset_dir  -> canonical COCO root (per-split `_annotations.coco.json`);
# !!       used by RF-DETR ONLY. Produced by `detectionbench-prepare-coco`.
name: bdd100k
dataset_yaml: /home/neural_debugger/Downloads/datasets/ObjectDetectionDatasets/BDD100K/yolo_dataset/data.yaml
dataset_dir: /home/neural_debugger/Downloads/datasets/ObjectDetectionDatasets/BDD100K/coco_dataset
num_classes: 10

eval_split: test
