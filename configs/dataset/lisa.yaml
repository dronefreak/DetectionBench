# dataset/lisa.yaml
# Hydra `dataset` config group entry for LISA Traffic Lights ("box" variant).
#
# Sourced from a pre-converted YOLO dataset (train/val/test + data.yaml,
# no prepare_coco/convert step needed). `dataset_yaml` points at a
# corrected copy of its data.yaml (see detectionbench_data.yaml next to
# the original in that directory -- the original uses a relative,
# wrong-case `path:` that doesn't resolve on this filesystem).
#
# `dataset_dir` (canonical COCO root, for RF-DETR) was generated directly
# from the `box` YOLO variant via:
#   detectionbench-convert-yolo-to-coco --input-dir "<box_dir>" --output-dir <coco_out> --dataset-yaml "<box_dir>/detectionbench_data.yaml"
# Its annotation counts (train 44657, valid 7169, test 57649) match the
# pre-existing `coco_rfdetr/` sibling of `yolo/` and the companion
# project's own reported counts -- confirmed consistent, not a stale copy.

# !! MACHINE-LOCAL PATHS: `dataset_yaml` and `dataset_dir` below are absolute
# !! paths on the original author's machine -- edit both to point at your own
# !! copies before training/evaluating on this dataset.
# !!   dataset_yaml -> Ultralytics YOLO `data.yaml` (used by YOLO / RT-DETR).
# !!       This is the format published on Hugging Face:
# !!       https://huggingface.co/datasets/dronefreak/LISA-Traffic-Lights
# !!   dataset_dir  -> canonical COCO root (per-split `_annotations.coco.json`);
# !!       used by RF-DETR ONLY. Not a download -- generate it locally from the
# !!       YOLO copy with `detectionbench-convert-yolo-to-coco`.
name: lisa
dataset_yaml: "/home/neural_debugger/Downloads/datasets/LISa/data/LISA-Traffic-Lights/data/yolo/box/detectionbench_data.yaml"
dataset_dir: "/home/neural_debugger/Downloads/datasets/LISa/yolo_dataset_coco"
num_classes: 7

eval_split: test
