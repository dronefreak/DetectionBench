#   detectionbench-convert-yolo-to-coco --input-dir <yolo_dir> --output-dir <coco_out> --dataset-yaml <yolo_dir>/detectionbench_data.yaml
# Verified 2026-08-03: train 5877 / valid 736 / test 734 images, categories
# match the 12-class spec, both COCO and YOLO representations checked.

