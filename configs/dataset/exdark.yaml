# dataset/exdark.yaml
# Hydra `dataset` config group entry for ExDark.
#
# Sourced from a Roboflow-exported YOLO dataset (already train/valid/test +
# data.yaml, no prepare_coco/convert step needed). `dataset_yaml` points at
# a corrected copy of its data.yaml (see detectionbench_data.yaml next to
# the original in that directory -- the Roboflow-generated one uses a
# relative `../train/images` pattern that resolves incorrectly).
#
# `dataset_dir` (canonical COCO root, for RF-DETR) was generated via:
#   detectionbench-convert-yolo-to-coco --input-dir <yolo_dir> --output-dir <coco_out> --dataset-yaml <yolo_dir>/detectionbench_data.yaml
# Verified 2026-08-03: train 5877 / valid 736 / test 734 images, categories
# match the 12-class spec, both COCO and YOLO representations checked.

# !! MACHINE-LOCAL PATHS: `dataset_yaml` and `dataset_dir` below are absolute
# !! paths on the original author's machine -- edit both to point at your own
# !! copies before training/evaluating on this dataset.
# !!   dataset_yaml -> Ultralytics YOLO `data.yaml` (used by YOLO / RT-DETR).
# !!       This is the format published on Hugging Face:
# !!       https://huggingface.co/datasets/dronefreak/ExDark
# !!   dataset_dir  -> canonical COCO root (per-split `_annotations.coco.json`);
# !!       used by RF-DETR ONLY. Not a download -- generate it locally from the
# !!       YOLO copy with `detectionbench-convert-yolo-to-coco`.
name: exdark
dataset_yaml: /home/neural_debugger/Downloads/datasets/ExDark/Exclusively-Dark-Image.v2i.yolo26/detectionbench_data.yaml
dataset_dir: /home/neural_debugger/Downloads/datasets/ExDark/yolo_dataset_coco
num_classes: 12

eval_split: test
